name = "yzdsk-ai"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# OPENAI_API_KEY bir SECRET'tır, buraya YAZILMAZ.
# Deploy'dan önce şu komutla bir kez girilir:
#   npx wrangler secret put OPENAI_API_KEY

# ── Model seçimi (env) ──────────────────────────────────────────────
# Modeli değiştirmek için yalnızca burayı düzenleyip `npx wrangler deploy` yap.
# Yerelde (`wrangler dev`) override etmek istersen worker/.dev.vars kullan.
[vars]
# AI Koç sohbeti (kart JSON üretimi)
# reasoning OLMAYAN model: sohbet reasoning gerektirmez ve gpt-5* reasoning tokenı bütçeyi
# yiyip "token sınırı" boş yanıtına yol açıyordu. gpt-4.1-mini hem güvenli hem ücretsiz kuyrukta bol.
CHAT_MODEL = "gpt-4.1-mini"
# Soru fotoğrafı çözümü — önce ucuz bir model zorluğu sınıflandırır, sonra ona göre çözücü seçilir:
VISION_MODEL_TRIAGE = "gpt-4.1-mini"   # zorluk/okunabilirlik triyajı (ucuz, hızlı)
VISION_MODEL_KOLAY  = "gpt-4.1"        # basit sorular (hızlı)
VISION_MODEL_ORTA   = "gpt-5-mini"     # orta sorular (denge)
VISION_MODEL_ZOR    = "gpt-5"          # zor sorular (en doğru)
