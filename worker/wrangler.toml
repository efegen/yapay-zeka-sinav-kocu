name = "yzdsk-ai"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# OPENAI_API_KEY bir SECRET'tır, buraya YAZILMAZ.
# Deploy'dan önce şu komutla bir kez girilir:
#   npx wrangler secret put OPENAI_API_KEY

# ── Model seçimi (env) ──────────────────────────────────────────────
# Modeli değiştirmek için yalnızca burayı düzenleyip `npx wrangler deploy` yap.
# Yerelde (`wrangler dev`) override etmek istersen worker/.dev.vars kullan.
# Günlük ÜCRETSİZ kota havuzları (paylaşımlı trafik programı):
#   · büyük havuz (gpt-5.x / gpt-4.1 / o-serisi): 250k token/gün → KIT, yalnızca ZOR sorulara
#   · mini havuz (gpt-5-mini / gpt-4.1-mini / nano):  2.5M token/gün → bol, geri kalan her şeye
[vars]
# AI Koç sohbeti (kart JSON üretimi)
# reasoning OLMAYAN model: sohbet reasoning gerektirmez ve gpt-5* reasoning tokenı bütçeyi
# yiyip "token sınırı" boş yanıtına yol açıyordu. gpt-4.1-mini hem güvenli hem mini havuzda bol.
CHAT_MODEL = "gpt-4.1-mini"
# Soru fotoğrafı çözümü — önce ucuz bir model zorluğu sınıflandırır, sonra ona göre çözücü seçilir:
VISION_MODEL_TRIAGE = "gpt-4.1-mini"   # zorluk/okunabilirlik triyajı (ucuz, hızlı)
VISION_MODEL_KOLAY  = "gpt-5-mini"     # basit sorular (reasoning 'minimal' → hızlı; mini havuz)
VISION_MODEL_ORTA   = "gpt-5-mini"     # orta sorular (low; triyaj tereddütlüyse medium)
VISION_MODEL_ZOR    = "gpt-5.1"        # zor sorular (büyük havuz; adaptif reasoning, en doğru)
# NOT: KOLAY/ORTA için gpt-5.1 KULLANMA ('minimal' eforu desteklemez); mini ailede kal.
# YKS (TYT) tarihi — koçun geri sayım bağlamı. Her yıl ÖSYM takvimiyle güncelle.
YKS_TARIH = "2026-06-20"
